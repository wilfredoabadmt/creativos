version: '3.8'

services:
  # 1. Reverse Proxy Nginx & SSL
  nginx:
    image: nginx:alpine
    container_name: gamea_comunica_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./public:/var/www/html:ro
    depends_on:
      - app

  # 2. Backend Node.js / Express API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamea_comunica_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=comunica_gamea
      - DB_USER=gamea_admin
      - DB_PASSWORD=SecretGamea2026_SecureDb!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=gamea_minio_access
      - MINIO_SECRET_KEY=GameaMinioSecretKey2026!
      - JWT_SECRET=gamea_jwt_ultra_secret_key_alcaldia_el_alto_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads

  # 3. Base de Datos Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: gamea_comunica_db
    restart: always
    environment:
      - POSTGRES_DB=comunica_gamea
      - POSTGRES_USER=gamea_admin
      - POSTGRES_PASSWORD=SecretGamea2026_SecureDb!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database/database-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamea_admin -d comunica_gamea"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Almacenamiento de Insumos y Entregables MinIO S3
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: gamea_comunica_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=gamea_minio_access
      - MINIO_ROOT_PASSWORD=GameaMinioSecretKey2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 5. Redis Cache & Token Store
  redis:
    image: redis:7-alpine
    container_name: gamea_comunica_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
